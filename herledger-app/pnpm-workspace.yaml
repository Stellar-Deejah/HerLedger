packages:
  - apps/*
  - packages/*
  - indexer

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - prisma

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'

minimumReleaseAgeExclude:
  - '@types/pg@8.23.1'
