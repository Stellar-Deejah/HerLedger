name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly testnet smoke run â€” catches contract upgrades that changed
    # behaviour without changing the WASM's declared interface shape enough
    # to show up in abi-check (or that landed between PRs).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  ci:
    name: Build, type check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: herledger
          POSTGRES_PASSWORD: herledger
          POSTGRES_DB: herledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://herledger:herledger@localhost:5432/herledger_test
      SHADOW_DATABASE_URL: postgresql://herledger:herledger@localhost:5432/herledger_shadow
      BETTER_AUTH_SECRET: 05fddafc9c2b3b1a6a57ab04d3677c73f59779b7ba60aaf931a38672f93ccc78
      RESEND_API_KEY: re_ci_test_key_not_a_real_key
      EMAIL_FROM: "HerLedger <onboarding@resend.dev>"
      APP_URL: http://localhost:3000
      STELLAR_NETWORK: testnet
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      BUSINESS_REGISTRY_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      FINANCIAL_LEDGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      ATTESTATION_REGISTRY_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      INDEXER_API_URL: http://localhost:4000
      ADMIN_API_TOKEN: ci-test-admin-token
      RECONCILIATION_CRON_SCHEDULE: "0 2 * * *"
      RECONCILIATION_SAMPLE_SIZE: "50"
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_BUSINESS_REGISTRY_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      NEXT_PUBLIC_FINANCIAL_LEDGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      NEXT_PUBLIC_ATTESTATION_REGISTRY_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: herledger-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: herledger-app

      - name: Format check
        run: pnpm format
        working-directory: herledger-app

      - name: Type check
        run: pnpm typecheck
        working-directory: herledger-app

      - name: Lint
        run: pnpm lint
        working-directory: herledger-app

      - name: OpenAPI spec drift check
        run: pnpm openapi:check
        working-directory: herledger-app

      - name: Validate .env.example
        run: cp .env.example .env.local && pnpm env:validate
        working-directory: herledger-app

      - name: Prisma validate
        run: pnpm prisma validate --schema prisma/schema.prisma
        working-directory: herledger-app

      - name: Create shadow database
        run: PGPASSWORD=herledger createdb -h localhost -U herledger herledger_shadow

      - name: Prisma generate
        run: pnpm db:generate
        working-directory: herledger-app

      - name: Validate database migrations
        run: pnpm exec tsx scripts/validate-migrations.ts
        working-directory: herledger-app

      - name: Prisma migrate
        run: pnpm db:migrate
        working-directory: herledger-app

      - name: Unit tests
        run: pnpm test
        working-directory: herledger-app

      - name: Build
        run: pnpm build
        working-directory: herledger-app

      - name: Build Storybook
        run: pnpm --filter web build-storybook
        working-directory: herledger-app

      - name: Upload Storybook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: herledger-app/apps/web/storybook-static
          retention-days: 7

  abi-check:
    name: Contract ABI codegen diff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Skip on the nightly schedule trigger â€” that run is for testnet-smoke only.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo / stellar-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            herledger-contract/target
          key: ${{ runner.os }}-cargo-stellar-26.1.0-${{ hashFiles('herledger-contract/Cargo.lock') }}

      - name: Install Stellar CLI
        run: |
          if ! command -v stellar >/dev/null 2>&1; then
            cargo install --locked stellar-cli@26.1.0
          fi

      - name: Build contracts
        run: ./scripts/build.sh
        working-directory: herledger-contract

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: herledger-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: herledger-app

      - name: Check generated ABI types match committed types
        run: pnpm --filter @herledger/sdk generate:abi:check

  testnet-smoke:
    name: Testnet smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nightly on schedule, or manually via workflow_dispatch (e.g. after an SDK version bump).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      TEST_AGAINST_TESTNET: "true"
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      # Deployed testnet contract IDs â€” repo secrets, not committed.
      # Configure under Settings â†’ Secrets and variables â†’ Actions.
      BUSINESS_REGISTRY_CONTRACT_ID: ${{ secrets.TESTNET_BUSINESS_REGISTRY_CONTRACT_ID }}
      FINANCIAL_LEDGER_CONTRACT_ID: ${{ secrets.TESTNET_FINANCIAL_LEDGER_CONTRACT_ID }}
      ATTESTATION_REGISTRY_CONTRACT_ID: ${{ secrets.TESTNET_ATTESTATION_REGISTRY_CONTRACT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: herledger-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: herledger-app

      - name: Run testnet smoke tests
        run: pnpm --filter @herledger/sdk test:smoke
        working-directory: herledger-app
