name: Regenerate Lockfile

on:
  workflow_dispatch: {}

jobs:
  regenerate:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Remove old lockfile
        run: rm -f pnpm-lock.yaml
        working-directory: herledger-app

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
        working-directory: herledger-app

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push lockfile
        run: |
          git add herledger-app/pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate pnpm-lock.yaml to include all workspace packages

This lockfile now includes:
- . (root)
- apps/web
- indexer
- packages/config
- packages/db (previously missing)
- packages/sdk

Generated by GitHub Actions with good network connectivity."
            git push
          fi
